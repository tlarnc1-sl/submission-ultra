<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見つかりません — 提出物Ultra</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&family=Inter:wght@400;500&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
<style>
  /* index.html と同じ系（docs/DESIGN.md）。このページで使う分だけを写している。
     共通の CSS ファイルに切り出していないのは、サイトが 2 枚しかないため。
     3 枚目を作るときは、そのとき初めて切り出すこと。 */
  :root {
    color-scheme: light;
    --primary: #17171c;
    --cohere-black: #000000;
    --ink: #212121;
    --body-muted: #616161;
    --muted: #93939f;
    --canvas: #ffffff;
    --hairline: #d9d9dd;
    --action-blue: #1863dc;
    --focus-blue: #4c6ee6;
    --on-dark: #ffffff;
    --pad: 16px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    max-width: 44rem;
    margin: 0 auto;
    padding: 56px var(--pad) 0;
    font-family: Inter, "Noto Sans JP", Arial, ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: 0;
    color: var(--ink);
    background: var(--canvas);
    text-wrap: pretty;
  }

  h1 {
    font-family: "Space Grotesk", Inter, ui-sans-serif, system-ui, sans-serif;
    font-size: 60px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -1.2px;
    margin: 0;
  }

  h2 {
    font-size: 32px;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: -.32px;
    margin: 80px 0 24px;
    padding-top: 32px;
    border-top: 1px solid var(--hairline);
  }

  p { margin: 16px 0; }

  a {
    color: var(--action-blue);
    text-decoration-thickness: 1px;
    text-underline-offset: .2em;
  }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--focus-blue); outline-offset: 2px; }

  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .9em;
    color: var(--body-muted);
  }

  .muted {
    color: var(--body-muted);
    font-size: 14px;
    line-height: 1.4;
  }

  header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
  }
  header img {
    width: 72px;
    height: 72px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .lead {
    font-size: 18px;
    line-height: 1.4;
    margin: 0;
  }

  .download-card {
    margin: 16px 0;
    padding: 32px;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    text-align: center;
  }
  .download-button {
    display: inline-block;
    padding: 12px 24px;
    background: var(--primary);
    color: var(--on-dark);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.71;
    border-radius: 32px;
    text-decoration: none;
  }
  .download-button:hover {
    background: var(--cohere-black);
    color: var(--on-dark);
  }

  footer {
    margin: 80px calc(-1 * var(--pad)) 0;
    padding: 56px var(--pad);
    background: var(--primary);
    color: var(--muted);
    font-size: 14px;
    line-height: 1.4;
  }
  footer p { margin: 12px 0; }
  footer a { color: var(--on-dark); }
  footer .muted { color: var(--muted); }

  @media (max-width: 600px) {
    h1 { font-size: 40px; letter-spacing: -.8px; }
    h2 { font-size: 24px; margin-top: 56px; }
    header img { width: 56px; height: 56px; }
    .download-card { padding: 24px; }
    footer { margin-top: 56px; padding: 40px var(--pad); }
  }
</style>
</head>
<body>

<header>
  <img src="icon.png" alt="">
  <h1>見つかりません</h1>
</header>

<p class="lead">このアドレスには、ページもファイルもありません。</p>

<h2>APK を探していた場合</h2>

<!--
  ここは特定の版へ直リンクしない。GitHub Releases の一覧へ送る。
  このページは古いリンクを踏んだ人のためにあるので、版を上げるたびに
  ここも直す作りにすると、いちばん放置されやすい場所が古くなる。
  リンク先が常に最新を指すようにしておけば、このファイルは二度と触らなくてよい。
-->
<p>
  配布場所を GitHub Releases に移しました。以前の
  <code>submission-ultra.apk</code> というアドレスはもう使えません。
</p>

<div class="download-card">
  <a class="download-button" href="https://github.com/tlarnc1-sl/submission-ultra/releases/latest">最新版をダウンロード</a>
</div>

<p class="muted">
  インストール時、提供元不明のアプリの許可が必要です。
</p>

<h2>そのほか</h2>

<p>
  <a href="/">トップページ</a>に、このアプリが何をするものかを書いています。
</p>

<footer>
  <p>
    <a href="https://github.com/tlarnc1-sl/submission-ultra">ソースコード（GitHub）</a><br>
    <a href="https://github.com/tlarnc1-sl/submission-ultra/releases">過去のバージョン</a>
  </p>
  <p class="muted">
    MIT License — Copyright (c) 2026 tarapon
  </p>
</footer>

</body>
</html>
